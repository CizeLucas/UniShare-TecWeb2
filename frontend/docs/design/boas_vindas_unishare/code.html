<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-scale:active {
            transform: scale(0.98);
        }
        body {
            background-color: #fcf8ff;
            overflow: hidden;
        }
    </style>
</head>
<body class="font-body-main text-on-surface min-h-screen flex flex-col justify-between">
<!-- Top Glow Effect (Decorative) -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[30%] bg-primary-container/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding text-center relative z-10">
<!-- Logo Section -->
<div class="mb-xl animate-fade-in-up">
<div class="relative inline-block">
<img alt="UniShare Logo" class="w-48 h-auto object-contain mx-auto transition-transform duration-700 hover:scale-105" src="https://lh3.googleusercontent.com/aida/ADBb0uhOcy11Rzuek-z177GvoWyyBEmhlrTZXvTk4_HKLbMqpQze7l2ItN_QIjoBPkUWmKOix4ODbylwZq68vJyEEGaJb_HerNW9m08f8CRu5GxgDT5BIEQYJbhv-emrsOKapPKbDH_SPrsoZ_GXbfDQZRL_HCzZYk0Y7jd5WZvG6818ylGnT1V4jDmcnomBYSCaDwXYfVmk2Obp8zUiKfZ6MeSC_uTqTFrKP6GycC76MNzlkOOU1d6sXgNLx4c"/>
</div>
</div>
<!-- Typography Cluster -->
<div class="max-w-[320px] mx-auto space-y-md">
<h1 class="font-display-title text-display-title text-on-surface tracking-tight">
                Bem-vindo ao UniShare
            </h1>
<p class="font-body-main text-body-main text-on-surface-variant leading-relaxed">
                Gestão financeira colaborativa e transparente para estudantes.
            </p>
</div>
<!-- Visual Decorative Elements (Asymmetric Layout Hint) -->
<div class="mt-xl grid grid-cols-2 gap-gutter w-full max-w-sm opacity-60">
<div class="h-1 bg-primary-container/20 rounded-full"></div>
<div class="h-1 bg-outline-variant/30 rounded-full w-2/3"></div>
</div>
</main>
<!-- Actions & Footer -->
<footer class="p-container-padding w-full max-w-md mx-auto space-y-md pb-[48px] animate-slide-up">
<!-- Primary Action: Começar agora -->
<button class="w-full h-[48px] bg-primary-container text-on-primary font-bold rounded-xl active-scale transition-all shadow-lg shadow-primary-container/20 flex items-center justify-center gap-sm" onclick="window.location.href='{{DATA:SCREEN:SCREEN_8}}'">
            Começar agora
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Secondary Action: Já tenho uma conta -->
<button class="w-full h-[48px] border-2 border-primary-container text-primary-container font-bold rounded-xl active-scale transition-all bg-white/50 backdrop-blur-sm" onclick="window.location.href='{{DATA:SCREEN:SCREEN_21}}'">
            Já tenho uma conta
        </button>
<!-- Micro-metadata -->
<div class="text-center pt-sm">
<p class="font-body-metadata text-body-metadata text-outline">
                Ao continuar, você concorda com nossos Termos.
            </p>
</div>
</footer>
<!-- Background Decorative Circles -->
<div class="fixed bottom-[-5%] right-[-5%] w-[40%] h-[20%] bg-tertiary-container/5 rounded-full blur-[80px] pointer-events-none"></div>
<script>
        // Simple entrance animations via CSS class additions
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            const footer = document.querySelector('footer');
            
            main.classList.add('opacity-0');
            footer.classList.add('opacity-0', 'translate-y-10');
            
            setTimeout(() => {
                main.classList.remove('opacity-0');
                main.classList.add('transition-all', 'duration-1000', 'opacity-100');
            }, 100);

            setTimeout(() => {
                footer.classList.remove('opacity-0', 'translate-y-10');
                footer.classList.add('transition-all', 'duration-700', 'opacity-100', 'translate-y-0');
            }, 400);
        });

        // Interactive haptic-like effect on buttons
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-[0.97]');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-[0.97]');
            });
        });
    </script>
<style>
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 1s ease-out forwards;
        }
    </style>
</body></html>
