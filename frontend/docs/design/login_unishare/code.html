<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniShare - Login</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=Space+Grotesk:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary-container": "#dad7ff",
                        "on-background": "#1b1b24",
                        "tertiary": "#7e3000",
                        "surface-container-highest": "#e4e1ee",
                        "on-secondary-fixed-variant": "#404754",
                        "tertiary-fixed-dim": "#ffb695",
                        "outline": "#777587",
                        "primary": "#3525cd",
                        "on-tertiary-container": "#ffd2be",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#151c27",
                        "surface-bright": "#fcf8ff",
                        "surface-container-high": "#eae6f4",
                        "surface-tint": "#4d44e3",
                        "secondary-fixed": "#dce2f3",
                        "outline-variant": "#c7c4d8",
                        "primary-container": "#4f46e5",
                        "secondary-fixed-dim": "#c0c7d6",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f5f2ff",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary": "#585f6c",
                        "inverse-surface": "#302f39",
                        "secondary-container": "#dce2f3",
                        "on-surface-variant": "#464555",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-container": "#a44100",
                        "surface-dim": "#dcd8e5",
                        "on-primary-fixed-variant": "#3323cc",
                        "tertiary-fixed": "#ffdbcc",
                        "on-tertiary-fixed": "#351000",
                        "inverse-primary": "#c3c0ff",
                        "inverse-on-surface": "#f3effc",
                        "surface-variant": "#e4e1ee",
                        "on-secondary-container": "#5e6572",
                        "surface": "#fcf8ff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "background": "#fcf8ff",
                        "primary-fixed": "#e2dfff",
                        "on-surface": "#1b1b24",
                        "surface-container": "#f0ecf9",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "container-padding": "20px",
                        "unit": "4px",
                        "md": "16px",
                        "gutter": "12px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-title": ["Inter"],
                        "currency-lg": ["Space Grotesk"],
                        "card-title": ["Inter"],
                        "body-main": ["Inter"],
                        "currency-sm": ["Space Grotesk"],
                        "body-metadata": ["Inter"]
                    },
                    "fontSize": {
                        "display-title": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "currency-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "card-title": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "currency-sm": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],

                }
            }
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-container-padding selection:bg-primary-container selection:text-on-primary-container antialiased">
<!-- Main Content Canvas (Navigation explicitly suppressed for Transactional Screen) -->
<main class="w-full max-w-[420px] w-full">
<!-- Glassmorphism Container Card -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-surface-variant p-lg flex flex-col gap-lg relative overflow-hidden">
<!-- Subtle decorative gradient -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header Section -->
<div class="flex flex-col items-center justify-center gap-unit mt-sm z-10">
<div class="w-12 h-12 bg-primary text-on-primary rounded-xl flex items-center justify-center shadow-sm mb-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-display-title text-display-title text-on-surface tracking-tight">UniShare</h1>
<p class="font-body-main text-body-main text-on-surface-variant text-center mt-xs">Gestão financeira transparente para repúblicas.</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md z-10 w-full mt-sm" method="POST">
<!-- Email Input (Floating Label) -->
<div class="relative w-full">
<input autocomplete="email" class="peer w-full h-[56px] px-md pt-[18px] pb-1 bg-surface-container rounded-lg font-body-main text-body-main text-on-surface border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest focus:outline-none transition-all placeholder-transparent" id="email" name="email" placeholder="Email" required="" type="email"/>
<label class="absolute left-md top-[16px] text-on-surface-variant font-body-metadata text-body-metadata transition-all pointer-events-none peer-placeholder-shown:top-[16px] peer-placeholder-shown:text-[16px] peer-focus:top-[6px] peer-focus:text-[11px] peer-focus:text-primary peer-focus:font-medium peer-valid:top-[6px] peer-valid:text-[11px] peer-valid:font-medium" for="email">
                        Email
                    </label>
</div>
<!-- Password Input (Floating Label) -->
<div class="relative w-full">
<input autocomplete="current-password" class="peer w-full h-[56px] px-md pt-[18px] pb-1 bg-surface-container rounded-lg font-body-main text-body-main text-on-surface border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest focus:outline-none transition-all placeholder-transparent" id="password" name="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-md top-[16px] text-on-surface-variant font-body-metadata text-body-metadata transition-all pointer-events-none peer-placeholder-shown:top-[16px] peer-placeholder-shown:text-[16px] peer-focus:top-[6px] peer-focus:text-[11px] peer-focus:text-primary peer-focus:font-medium peer-valid:top-[6px] peer-valid:text-[11px] peer-valid:font-medium" for="password">
                        Senha
                    </label>
</div>
<!-- Auxiliary Actions -->
<div class="flex justify-end mt-xs">
<a class="font-body-metadata text-body-metadata text-primary font-medium hover:text-on-primary-fixed-variant transition-colors" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[48px] mt-xs bg-primary text-on-primary font-body-main text-body-main font-semibold rounded-lg shadow-sm hover:bg-on-primary-fixed-variant focus:ring-4 focus:ring-primary-container/50 active:scale-[0.98] transition-all flex justify-center items-center gap-xs" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Footer Section -->
<div class="flex justify-center mt-md mb-sm z-10">
<p class="font-body-metadata text-body-metadata text-on-surface-variant">
                    Não tem uma conta? 
                    <a class="text-primary font-semibold hover:text-on-primary-fixed-variant transition-colors ml-1" href="#">
                        Cadastre-se
                    </a>
</p>
</div>
</div>
</main>
</body></html>
